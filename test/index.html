<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title>Mocha Tests</title>
<link rel='stylesheet' href='../node_modules/mocha/mocha.css'>
</head>

<body style="overflow:scroll">
<div id='mocha'></div>

<script src='../node_modules/mocha/mocha.js'></script>
<script src='../dist/js/rapid-dev.js'></script>

<script type='module'>

// Setup chai
import { assert } from '../node_modules/chai/index.js';
window.assert = assert;

// Setup mocha
mocha.setup({
  timeout: 5000,  // 5 sec
  ui: 'bdd',
  globals: [
    '__onmousemove.zoom',
    '__onmouseup.zoom',
    '__onkeydown.select',
    '__onkeyup.select',
    '__onclick.draw',
    '__onclick.draw-block'
  ]
});

// Try not to load imagery
window.location.hash = '#background=none';

// Force the browser to use mouse events
delete window.PointerEvent;


var scripts = [
  'browser/Context.test.js',

  'browser/operations/extract.test.js',
  'browser/operations/straighten.test.js',

  // 'browser/svg/tag_classes.test.js',

  'browser/ui/combobox.test.js',
  'browser/ui/confirm.test.js',
  'browser/ui/flash.test.js',
  'browser/ui/icon.test.js',
  'browser/ui/modal.test.js',
  'browser/ui/sections/raw_tag_editor.test.js',
  'browser/ui/fields/access.test.js',
  'browser/ui/fields/localized.test.js',
  'browser/ui/fields/wikipedia.test.js',

  'browser/util/cmd.test.js'
];

window.executionErrors = [];

window.onerror = function (message, source, line, col) {
  window.executionErrors.push(message + " source: " + source + " line: " + line + " col: " + col);
};

// Create and execute all test scripts in specified order..
function nextScript() {
  if (!scripts.length) {
    window.mocha.run();

    if (window.executionErrors.length > 0){
      console.log('\n[Execution errors exist] Please resolve the following:');
      for (var i = 0; i < window.executionErrors.length; i++){
        console.log('[Execution error] ' + window.executionErrors[i]);
      }
      console.log('Disposing mocha.');
      window.mocha.dispose();
    }
    return;
  }
  var src = scripts.shift();
  var newScript;
  newScript = document.createElement('script');
  newScript.type = 'text/javascript';
  newScript.src = src;
  newScript.onload = nextScript;
  document.getElementsByTagName('body')[0].appendChild(newScript);
}

nextScript();

</script>
</body>
</html>
