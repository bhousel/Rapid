name: build

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

env:
  FORCE_COLOR: 2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - run: |
        echo "::remove-matcher owner=eslint-compact::"
        echo "::remove-matcher owner=eslint-stylish::"

    - name: 📥  Checkout
      uses: actions/checkout@v4

    - name: 🥟  Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.6'
        cache: true

    - name: 🏗️  Install
      run: bun install

    - name: 🔨  Build
      run: bun run all

    - name: 🧪  Test
      run: bun test
