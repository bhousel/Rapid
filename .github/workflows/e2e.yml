name: e2e

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_COLOR: 2

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - run: bun install --frozen-lockfile
    - name: Install Playwright's Chromium
      run: bunx playwright install --with-deps chromium
    - name: Run the e2e tests (builds and serves Rapid first)
      run: bun run test:e2e
    - name: Upload the report and traces
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          test/e2e/report/
          test/e2e/results/
        retention-days: 14
